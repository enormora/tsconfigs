name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    static-analysis:
        name: Static analysis
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: package.json
            - run: npm ci --ignore-scripts
            - run: npx just lint

    compile:
        name: Compile TypeScript
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: package.json
            - run: npm ci --ignore-scripts
            - run: npx just compile

    integration-tests:
        name: Integration tests
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: package.json
            - run: npm ci --ignore-scripts
            - run: npx just integration-test

    package-dry-run:
        name: Package dry run
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: package.json
            - run: npm ci --ignore-scripts
            - run: npx just publish-dry-run

    workflow-security:
        name: Workflow security analysis
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Install Actions lockfile verifier
              run: gh extension install github/gh-actions-lock --pin v0.4.1
              env:
                  GH_TOKEN: ${{ github.token }}
            - name: Verify Actions lockfile
              run: gh actions-lock --verify
              env:
                  GH_TOKEN: ${{ github.token }}
            - name: Run zizmor
              uses: zizmorcore/zizmor-action@v0.7.1
              with:
                  version: 1.32.0
                  persona: pedantic
                  min-severity: informational
                  min-confidence: low
                  config: .github/zizmor.yml
                  advanced-security: false
                  annotations: true
