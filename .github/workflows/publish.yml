name: Publish

on:
    workflow_dispatch:

permissions: {}

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        name: Publish packages
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        environment: npm
        permissions:
            contents: write # Create package tags and GitHub releases.
            id-token: write # Authenticate npm Trusted Publishing and provenance.
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: 26.x
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npx just check
            - run: npm audit signatures
            - name: Publish with provenance
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npx packtory release --publish --tag --push --github-release --no-dry-run
